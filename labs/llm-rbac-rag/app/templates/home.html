{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Ask a Question</h2>
            </div>
            <div class="card-body">
                <form method="POST" id="questionForm">
                    <div class="mb-3">
                        <label for="question" class="form-label">Your Question</label>
                        <textarea class="form-control" id="question" name="question" rows="3" required>{{ question }}</textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Submit Question</button>
                    </div>
                </form>

                <div id="loadingSpinner" class="text-center mt-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Attempting to answer your question...</p>
                </div>

                {% if answer and answer.strip() %}
                <div class="mt-4">
                    <h3>Answer:</h3>
                    <div class="card">
                        <div class="card-body">
                            {{ answer | safe }}
                        </div>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('questionForm').addEventListener('submit', function() {
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('loadingSpinner').style.display = 'block';
});
</script>
{% endblock %}
