services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=backend.app
      - MODE=${MODE:-attack}
      - CHROMA_EMBEDDING_MODEL_PATH=/app/models/all-MiniLM-L6-v2
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
