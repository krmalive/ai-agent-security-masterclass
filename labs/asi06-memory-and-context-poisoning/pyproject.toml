[project]
name = "asi06-memory-and-context-poisoning"
version = "1.0.0"
description = "ASI06 Memory & Context Poisoning Lab"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "openai>=1.0.0",
    "openai-agents>=0.0.14",
    "chromadb>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
