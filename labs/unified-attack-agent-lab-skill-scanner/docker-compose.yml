services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=backend/app.py
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./skills:/app/skills
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
