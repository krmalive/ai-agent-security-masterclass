[project]
name = "unified-attack-agent-lab"
version = "1.0.0"
description = "Unified OWASP ASI01/ASI02/ASI03 vulnerable agent lab"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "openai>=1.0.0",
    "openai-agents>=0.0.14",
    "cisco-ai-skill-scanner==2.0.11"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
