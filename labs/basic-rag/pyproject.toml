[project]
name = "shopfast-agentic-rag-lab"
version = "0.1.0"
description = "Agentic RAG lab that builds a cited ShopFast security test plan from OWASP WSTG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "openai",
    "chromadb",
    "pypdf",
    "crewai[tools]>=1.15,<1.16",
    "sse-starlette>=3.4.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
