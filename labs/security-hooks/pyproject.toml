[project]
name = "security-hooks-lab"
version = "0.1.0"
description = "Hands-on lab: blocking prompt-injection / data-exfiltration in a PR-review agent using OpenAI Agents SDK hooks (mock, course demo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.7.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
lab = "security_hooks_lab.cli:main"
exfil-server = "exfil_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_hooks_lab", "exfil_server"]

[tool.hatch.build.targets.wheel.force-include]
"exfil_server/dashboard.html" = "exfil_server/dashboard.html"
