<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault-Brokered Agent Credentials</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fa; }
    .cred-badge { font-family: var(--bs-font-monospace); font-size: .8rem; }
    pre.activity { white-space: pre-wrap; font-size: .8rem; margin-bottom: 0; }
    .navbar-brand span { color: #ffc107; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">🔐 <span>Vault</span>-Brokered Agent</a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link {% if active == 'chat' %}active fw-bold{% endif %}" href="/">Agent Chat</a></li>
      <li class="nav-item"><a class="nav-link {% if active == 'broker' %}active fw-bold{% endif %}" href="/broker">Broker Status</a></li>
      <li class="nav-item"><a class="nav-link {% if active == 'audit' %}active fw-bold{% endif %}" href="/audit">Vault Audit Log</a></li>
    </ul>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
</body>
</html>
