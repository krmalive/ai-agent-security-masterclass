[project]
name = "vault-agent-credential-broker"
version = "0.1.0"
description = "Brokered credential access for AI agents: OpenAI Agents SDK + HashiCorp Vault (AppRole, dynamic Postgres creds, KV, audit)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "hvac>=2.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "openai-agents>=0.17.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
]
